# Aulas 03/04/05: ENTREGA CONTÍNUA na máquina da AWS.
# Fluxo: build -> imagem Docker -> push no Docker Hub -> SSH na EC2 -> troca o container.
#
# Para ligar:
#   Settings > Secrets and variables > Actions
#     Secrets:   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, HOST_TEST (IP da EC2), KEY_TEST (conteúdo do .pem), DB_PASSWORD
#     Variables: DEPLOY_ENABLED = true
# Na EC2 (uma vez): docker network create -d bridge rede
#                   docker run -d --name postgres --network rede -e POSTGRES_DB=auladb -e POSTGRES_USER=usuario -e POSTGRES_PASSWORD=<senha> postgres:15-alpine
#                   docker run -d --name redis --network rede redis:7-alpine
name: Deploy AWS
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build (com testes)
        run: mvn -B package

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/estudo-projsoft:${{ github.sha }}

      - name: Atualizar container na EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_TEST }}
          username: ubuntu
          key: ${{ secrets.KEY_TEST }}
          port: 22
          script: |
            docker rm --force estudo || true
            docker run -d -p 8080:8080 --network rede --name estudo \
              -e DB_HOST=postgres -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} -e REDIS_HOST=redis \
              ${{ secrets.DOCKERHUB_USERNAME }}/estudo-projsoft:${{ github.sha }}
