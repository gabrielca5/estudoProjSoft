# Aula 04/06: roda os testes em todo Pull Request e comenta a cobertura no PR.
# Se a cobertura ficar abaixo do mínimo, o PR fica vermelho (quality gate).
name: Testes no PR
on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: mvn -B clean verify
      - name: Cobertura JaCoCo
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: tests/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80
          fail-build: true
