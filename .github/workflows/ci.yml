# Aula 04: INTEGRAÇÃO CONTÍNUA
# A cada push: compila e roda TODOS os testes (unidade + integração com Testcontainers).
name: CI
on:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build e testes
        run: mvn -B verify
      - name: Guardar relatório JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: tests/
